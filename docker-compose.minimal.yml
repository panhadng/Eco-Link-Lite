# Minimal setup - Only essential services for development
# Usage: docker compose -f docker-compose.minimal.yml up -d

services:
  webapp:
    image: ghcr.io/ocelot-social-community/ocelot-social/webapp:local-development
    build:
      context: .
      dockerfile: ./webapp/Dockerfile
      target: development
    depends_on:
      - backend
    ports:
      - 3000:3000
    environment:
      - NODE_ENV="development"
      - HOST=0.0.0.0
      - GRAPHQL_URI=http://backend:4000
      - NUXT_BUILD=/tmp/nuxt
    env_file:
      - ./webapp/.env
    volumes:
      - ./webapp:/app

  backend:
    image: ghcr.io/ocelot-social-community/ocelot-social/backend:local-development
    build:
      context: ./backend
      target: development
    depends_on:
      - neo4j
      - mailserver
      - minio
      - minio-mc
      - imagor
    ports:
      - 4000:4000
    environment:
      - NODE_ENV="development"
      - NEO4J_URI=bolt://neo4j:7687
      - GRAPHQL_URI=http://backend:4000
      - CLIENT_URI=http://webapp:3000
      - SMTP_PORT=1025
      - SMTP_HOST=mailserver
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=12341234
      - AWS_ENDPOINT=http://minio:9000
      - AWS_REGION=local
      - AWS_BUCKET=ocelot
      - IMAGOR_PUBLIC_URL=http://imagor:8000
      - IMAGOR_SECRET=mysecret
      - PROXY_S3=http://minio:9000
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app

  neo4j:
    image: ghcr.io/ocelot-social-community/ocelot-social/neo4j:community
    build:
      context: ./neo4j
      target: community
    ports:
      - 7474:7474  # Browser UI
      - 7687:7687  # Bolt protocol
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=none
      - NEO4J_dbms_security_procedures_unrestricted=algo.*,apoc.*
      - NEO4J_dbms_allow__format__migration=true
      - NEO4J_dbms_allow__upgrade=true

  mailserver:
    image: maildev/maildev
    container_name: mailserver
    ports:
      - 1080:1080  # Web UI to view emails
      - 1025:1025  # SMTP port

  minio:
    image: quay.io/minio/minio
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=12341234
    command: server /data --console-address ":9001"

  minio-mc:
    image: quay.io/minio/mc
    depends_on:
      - minio
    restart: on-failure
    volumes:
      - ./minio/readonly-policy.json:/tmp/readonly-policy.json
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set dockerminio http://minio:9000 minio 12341234;
      /usr/bin/mc mb --ignore-existing dockerminio/ocelot;
      /usr/bin/mc anonymous set-json /tmp/readonly-policy.json dockerminio/ocelot;
      "

  imagor:
    image: shumc/imagor:latest
    ports:
      - 8000:8000
    environment:
      PORT: 8000
      IMAGOR_SECRET: mysecret
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: 12341234
      AWS_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: 1
      S3_LOADER_BUCKET: ocelot
      S3_STORAGE_BUCKET: ocelot
      S3_RESULT_STORAGE_BUCKET: ocelot
      HTTP_LOADER_BASE_URL: http://minio:9000

volumes:
  neo4j_data:
  minio_data:

