# This file defines the production settings. It is overwritten by docker-compose.override.yml,
# which defines the development settings. The override.yml is loaded by default. Therefore it
# is required to explicitly define if you want an production build:
# > docker-compose -f docker-compose.yml up

services:
  backend:
    image: ghcr.io/ecolink-backend:${OCELOT_VERSION:-latest}
    build:
      context: ./backend
      target: production
    depends_on:
      - neo4j
      - mailserver
      - minio
      - minio-mc
      - imagor
    ports:
      - 4000:4000
    environment:
      # Envs used in Dockerfile
      # - DOCKER_WORKDIR="/app"
      # - PORT="4000"
      - NODE_ENV="production"
      # Application only envs
      - NEO4J_URI=bolt://neo4j:7687
      - GRAPHQL_URI=http://backend:4000
      - SMTP_PORT=1025
      - SMTP_HOST=mailserver
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=12341234
      - AWS_ENDPOINT=http://minio:9000
      - AWS_REGION=local
      - AWS_BUCKET=ecolink
      - IMAGOR_PUBLIC_URL=http://13.203.0.20:8000
      - IMAGOR_SECRET=mysecret
      # PROXY_S3 is only for local dev - in production, set to public IP for URL rewriting
      # This makes image URLs use the server IP instead of localhost or internal service names
      # IMPORTANT: Make sure backend/.env does NOT override this with localhost
      - PROXY_S3=http://13.203.0.20:9000
    env_file:
      - ./backend/.env
    # Note: env_file values override environment values, so ensure backend/.env has PROXY_S3=http://13.203.0.20:9000

  maintenance:
    image: ghcr.io/ecolink-maintenance:${OCELOT_VERSION:-latest}
    build:
      context: .
      dockerfile: ./webapp/Dockerfile.maintenance
    ports:
      - 3001:80

  neo4j:
    image: ghcr.io/ecolink-neo4j:community
    build:
      context: ./neo4j
      # community edition 👆🏼, because we have no enterprise licence 👇🏼 at the moment
      target: community
    ports:
      - 7687:7687
    volumes:
      - neo4j_data:/data
    environment:
      # settings reference: https://neo4j.com/docs/operations-manual/4.4/docker/ref-settings/
      # TODO: This sounds scary for a production environment
      - NEO4J_AUTH=none
      - NEO4J_dbms_security_procedures_unrestricted=algo.*,apoc.*
      - NEO4J_dbms_allow__format__migration=true
      - NEO4J_dbms_allow__upgrade=true
      # uncomment following line for Neo4j Enterprise version instead of Community version
      # TODO: clarify if that is the only thing needed to unlock the Enterprise version
      # - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      # set the name of the database to be used
      # - NEO4J_dbms_default__database=graph.db
      # - NEO4J_dbms_default__database=neo4j
      # TODO: Remove the playground from production
    # bring the database in offline mode to export or load dumps
    # command: ["tail", "-f", "/dev/null"]

  mailserver:
    image: maildev/maildev
    container_name: eco-mailserver
    ports:
      - 1080:1080  # Web UI to view emails
      - 1025:1025  # SMTP port

  minio:
    image: quay.io/minio/minio
    container_name: eco-minio
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=12341234
    command: server /data --console-address ":9001" --address ":9000"
    # Configure CORS for public access
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio-mc:
    image: quay.io/minio/mc
    container_name: eco-minio-mc
    depends_on:
      - minio
    restart: on-failure
    volumes:
      - ./minio/readonly-policy.json:/tmp/readonly-policy.json
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set dockerminio http://minio:9000 minio 12341234;
      /usr/bin/mc mb --ignore-existing dockerminio/ecolink;
      /usr/bin/mc anonymous set-json /tmp/readonly-policy.json dockerminio/ecolink;
      /usr/bin/mc cors set download dockerminio/ecolink;
      /usr/bin/mc cors set public dockerminio/ecolink;
      "

  imagor:
    image: shumc/imagor:latest
    container_name: eco-imagor
    ports:
      - 8000:8000
    environment:
      PORT: 8000
      IMAGOR_SECRET: mysecret
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: 12341234
      AWS_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: 1
      S3_LOADER_BUCKET: ecolink
      S3_STORAGE_BUCKET: ecolink
      S3_RESULT_STORAGE_BUCKET: ecolink
      HTTP_LOADER_BASE_URL: http://minio:9000

volumes:
  neo4j_data:
  minio_data:
