# Production Docker Compose for AWS Lightsail
# Usage: docker compose -f docker-compose.prod.yml up -d
# Note: Update environment variables and secrets for production use

version: '3.8'

services:
  webapp:
    image: ghcr.io/ocelot-social-community/ocelot-social/webapp:latest
    # For production, use the latest stable image instead of building
    # Uncomment build section if you need to build from source
    # build:
    #   context: .
    #   dockerfile: ./webapp/Dockerfile
    #   target: production
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - GRAPHQL_URI=http://backend:4000
      - NUXT_BUILD=/tmp/nuxt
    restart: unless-stopped
    networks:
      - app-network
    # Remove volumes in production - code should be baked into image
    # volumes:
    #   - ./webapp:/app

  backend:
    image: ghcr.io/ocelot-social-community/ocelot-social/backend:latest
    # For production, use the latest stable image instead of building
    # Uncomment build section if you need to build from source
    # build:
    #   context: ./backend
    #   dockerfile: ./backend/Dockerfile
    #   target: production
    depends_on:
      - neo4j
      - mailserver
      - minio
      - minio-mc
      - imagor
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - NEO4J_URI=bolt://neo4j:7687
      - GRAPHQL_URI=http://backend:4000
      - CLIENT_URI=http://webapp:3000
      - SMTP_PORT=1025
      - SMTP_HOST=mailserver
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=12341234
      - AWS_ENDPOINT=http://minio:9000
      - AWS_REGION=local
      - AWS_BUCKET=ocelot
      - IMAGOR_PUBLIC_URL=http://imagor:8000
      - IMAGOR_SECRET=mysecret
      - PROXY_S3=http://minio:9000
      # TODO: Add production secrets via environment variables or secrets management
      # - JWT_SECRET=${JWT_SECRET}
      # - NEO4J_AUTH=${NEO4J_AUTH}
    restart: unless-stopped
    networks:
      - app-network
    # Remove volumes in production - code should be baked into image
    # volumes:
    #   - ./backend:/app

  neo4j:
    image: ghcr.io/ocelot-social-community/ocelot-social/neo4j:community
    # Or use official Neo4j image: neo4j:5-community
    # build:
    #   context: ./neo4j
    #   dockerfile: ./neo4j/Dockerfile
    #   target: community
    ports:
      - "7474:7474"  # Browser UI (consider removing in production or securing with firewall)
      - "7687:7687"  # Bolt protocol
    volumes:
      - neo4j_data:/data
    environment:
      # TODO: Set proper Neo4j authentication in production
      - NEO4J_AUTH=none  # Change to: neo4j/your-strong-password
      - NEO4J_dbms_security_procedures_unrestricted=algo.*,apoc.*
      - NEO4J_dbms_allow__format__migration=true
      - NEO4J_dbms_allow__upgrade=true
      # Production settings
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    restart: unless-stopped
    networks:
      - app-network

  mailserver:
    image: maildev/maildev
    container_name: mailserver
    ports:
      - "1080:1080"  # Web UI (consider removing in production)
      - "1025:1025"  # SMTP port
    restart: unless-stopped
    networks:
      - app-network
    # TODO: Replace with production SMTP service (AWS SES, SendGrid, etc.)
    # For production, you should use a real SMTP service instead of maildev

  minio:
    image: quay.io/minio/minio:latest
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console (consider removing in production or securing)
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=12341234
      # TODO: Change to strong credentials in production
      # - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      # - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - app-network
    # TODO: For production, consider using AWS S3 instead of MinIO

  minio-mc:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    restart: on-failure
    volumes:
      - ./minio/readonly-policy.json:/tmp/readonly-policy.json
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set dockerminio http://minio:9000 minio 12341234;
      /usr/bin/mc mb --ignore-existing dockerminio/ocelot;
      /usr/bin/mc anonymous set-json /tmp/readonly-policy.json dockerminio/ocelot;
      "
    networks:
      - app-network

  imagor:
    image: shumc/imagor:latest
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - IMAGOR_SECRET=mysecret
      # TODO: Change to strong secret in production
      # - IMAGOR_SECRET=${IMAGOR_SECRET}
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=12341234
      - AWS_ENDPOINT=http://minio:9000
      - S3_FORCE_PATH_STYLE=1
      - S3_LOADER_BUCKET=ocelot
      - S3_STORAGE_BUCKET=ocelot
      - S3_RESULT_STORAGE_BUCKET=ocelot
      - HTTP_LOADER_BASE_URL=http://minio:9000
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  neo4j_data:
    driver: local
  minio_data:
    driver: local

