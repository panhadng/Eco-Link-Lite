version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PROXY_S3: http://minio:9000
        NODE_ENV: production
    container_name: eco-backend
    depends_on:
      neo4j:
        condition: service_healthy
      mailserver:
        condition: service_started
      minio:
        condition: service_healthy
      minio-mc:
        condition: service_completed_successfully
      imagor:
        condition: service_started
    ports:
      - "4000:4000"  # GraphQL API - publicly accessible
    environment:
      - NODE_ENV=production
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - GRAPHQL_URI=http://backend:4000
      - SMTP_PORT=1025
      - SMTP_HOST=mailserver
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_ENDPOINT=http://minio:9000
      - AWS_REGION=local
      - AWS_BUCKET=${MINIO_BUCKET:-ocelot}
      - IMAGOR_PUBLIC_URL=http://imagor:8000
      - IMAGOR_SECRET=${IMAGOR_SECRET}
      - PROXY_S3=http://minio:9000
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  neo4j:
    image: neo4j:5-community
    container_name: eco-neo4j
    # Only expose Bolt port internally, not publicly
    ports:
      - "127.0.0.1:7687:7687"  # Bolt protocol - localhost only
      # Neo4j Browser UI (7474) not exposed publicly for security
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      - NEO4J_dbms_security_procedures_unrestricted=algo.*,apoc.*
      - NEO4J_dbms_allow__format__migration=true
      - NEO4J_dbms_allow__upgrade=true
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mailserver:
    image: maildev/maildev
    container_name: eco-mailserver
    # SMTP port only, web UI not exposed publicly
    ports:
      - "127.0.0.1:1025:1025"  # SMTP port - localhost only
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: quay.io/minio/minio
    container_name: eco-minio
    # MinIO API and Console - not exposed publicly (use reverse proxy if needed)
    ports:
      - "127.0.0.1:9000:9000"  # MinIO API - localhost only
      - "127.0.0.1:9001:9001"  # MinIO Console - localhost only
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio-mc:
    image: quay.io/minio/mc
    container_name: eco-minio-mc
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    volumes:
      - ./minio/readonly-policy.json:/tmp/readonly-policy.json
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET:-ocelot}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set dockerminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb --ignore-existing dockerminio/$${MINIO_BUCKET};
      /usr/bin/mc anonymous set-json /tmp/readonly-policy.json dockerminio/$${MINIO_BUCKET};
      "
    networks:
      - app-network

  imagor:
    image: shumc/imagor:latest
    container_name: eco-imagor
    ports:
      - "8000:8000"  # Image processing - publicly accessible
    environment:
      PORT: 8000
      IMAGOR_SECRET: ${IMAGOR_SECRET}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: 1
      S3_LOADER_BUCKET: ${MINIO_BUCKET:-ocelot}
      S3_STORAGE_BUCKET: ${MINIO_BUCKET:-ocelot}
      S3_RESULT_STORAGE_BUCKET: ${MINIO_BUCKET:-ocelot}
      HTTP_LOADER_BASE_URL: http://minio:9000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    driver: bridge

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  minio_data:
    driver: local
