version: '3.8'

services:
  backend:
    build:
      context: ./backend   # <-- UPDATE THIS after you confirm
      dockerfile: Dockerfile
    container_name: eco-backend
    depends_on:
      - neo4j
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - NEO4J_URI=bolt://neo4j:7687
    restart: unless-stopped
    networks:
      - app-network

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=none
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  neo4j_data:
    driver: local
