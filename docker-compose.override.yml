services:

  backend:
    image: ghcr.io/ecolink-backend:local-development
    depends_on:
      - minio
      - minio-mc
      - imagor
    build:
      target: development
    environment:
      - NODE_ENV="development"
      # MailDev Configuration (for local development - no authentication needed)
      - SMTP_PORT=1025
      - SMTP_HOST=mailserver
      - SMTP_IGNORE_TLS=true
      - EMAIL_DEFAULT_SENDER=BrianDuong7777@gmail.com
      # For production with Gmail, use these settings instead:
      # - SMTP_HOST=smtp.gmail.com
      # - SMTP_PORT=587
      # - SMTP_SECURE=false
      # - SMTP_IGNORE_TLS=false
      # - SMTP_USERNAME=BrianDuong7777@gmail.com
      # - SMTP_PASSWORD=${GMAIL_APP_PASSWORD}
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=12341234
      - AWS_ENDPOINT=http://minio:9000
      - AWS_REGION=local
      - AWS_BUCKET=ecolink
      - IMAGOR_PUBLIC_URL=http://localhost:8000
      - IMAGOR_SECRET=mysecret
      - PROXY_S3=http://minio:9000
    volumes:
      - ./backend:/app

  neo4j:
    ports:
      # Also expose the neo4j query browser
      - 7474:7474
    environment:
    - NEO4J_server_memory_heap_initial__size=512m
    - NEO4J_server_memory_heap_max__size=1g
    - NEO4J_server_memory_pagecache_size=1g
    mem_limit: 2g

  mailserver:
    image: maildev/maildev
    container_name: mailserver
    ports:
      - 1080:1080
      - 1025:1025

  minio:
    image: quay.io/minio/minio
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=12341234
    command: server /data --console-address ":9001"

  minio-mc:
    image: quay.io/minio/mc
    depends_on:
      - minio
    restart: on-failure
    volumes:
      - ./minio/readonly-policy.json:/tmp/readonly-policy.json
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set dockerminio http://minio:9000 minio 12341234;
      /usr/bin/mc mb --ignore-existing dockerminio/ecolink;
      /usr/bin/mc anonymous set-json /tmp/readonly-policy.json dockerminio/ecolink;
      "

  imagor:
    image: shumc/imagor:latest
    ports:
      - 8000:8000
    environment:
      PORT: 8000
      IMAGOR_SECRET: mysecret # secret key for URL signature
      # IMAGOR_UNSAFE: 1 # unsafe URL for testing
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: 12341234
      AWS_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: 1
      S3_LOADER_BUCKET: ecolink # enable S3 loader by specifying bucket
      S3_STORAGE_BUCKET: ecolink # enable S3 storage by specifying bucket
      S3_RESULT_STORAGE_BUCKET: ecolink # enable S3 result storage by specifying bucket
      HTTP_LOADER_BASE_URL: http://minio:9000

volumes:
  minio_data: